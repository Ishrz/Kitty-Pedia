<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="kitty_pedia — browse cat breeds, search the encyclopedia, and get AI-powered breed recommendations."
    />
    <meta name="theme-color" content="#fbf7f2" />
    <title>kitty pedia  cat breed encyclopedia</title>
    <script>
      // Applied before paint so a dark-mode reload never flashes white.
      try {
        const stored = localStorage.getItem("theme")
        const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
        if (dark) document.documentElement.classList.add("dark")
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
